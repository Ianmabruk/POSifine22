[pytest]
# Pytest configuration for POS backend tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov=auth
    --cov=database
    --cov=stock_engine
    --cov=cache_manager
    --cov=business_routes
    --cov=message_routes
    --cov=notify_service
    --cov=admin_controller
    --cov=cashier_controller
    --cov=credit_requests_controller
    --cov=discounts_service_fees_controller
    --cov=reminders_controller
    --cov=services
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=40
    --maxfail=5

# Coverage options
[coverage:run]
omit = 
    */tests/*
    */venv/*
    */backup/*
    */__pycache__/*
    */migrations.py
    */backup_database.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    auth: Authentication tests
    products: Product management tests
    sales: Sales transaction tests
    api: API endpoint tests
