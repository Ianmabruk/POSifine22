[pytest]
# Pytest configuration for POS backend tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v                          # Verbose output
    --tb=short                  # Short traceback format
    --strict-markers            # Strict marker usage
    --cov=.                     # Coverage for current directory
    --cov-report=html           # HTML coverage report
    --cov-report=term-missing   # Show missing lines in terminal
    --cov-fail-under=70         # Require 70% coverage minimum
    --maxfail=5                 # Stop after 5 failures

# Coverage options
[coverage:run]
omit = 
    */tests/*
    */venv/*
    */backup/*
    */__pycache__/*
    */migrations.py
    */backup_database.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    auth: Authentication tests
    products: Product management tests
    sales: Sales transaction tests
    api: API endpoint tests
