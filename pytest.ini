[pytest]
# Pytest configuration for POS backend tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70
    --maxfail=5

# Coverage options
[coverage:run]
omit = 
    */tests/*
    */venv/*
    */backup/*
    */__pycache__/*
    */migrations.py
    */backup_database.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    auth: Authentication tests
    products: Product management tests
    sales: Sales transaction tests
    api: API endpoint tests
